  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          // Dark end of the neutral ramp, lifted off pure black to charcoal.
          // Stock Tailwind bottoms out at #0a0a0a/#171717, which reads as a
          // black void on OLED and hides the border-only surface hierarchy.
          // Steps keep their original ordering and spacing so every existing
          // bg-/border-/text-neutral-* utility stays in the same relative
          // position. Light mode is unaffected: html.light below overrides
          // these class names with !important.
          colors: {
            neutral: {
              600: '#61616a',
              700: '#4c4c54',
              800: '#3a3a40',
              900: '#2a2a2e',
              950: '#1c1c1f',
            },
          },
        }
      }
    };
  </script>

  <!-- Dark-theme default border color. Tailwind Preflight resets every
       element's border-color to gray-200 (a light color); any element that
       has a border width but no explicit border-* utility then shows harsh
       light lines in the dark UI. Re-default it to neutral-800 for the dark
       theme. Kept in @layer base so explicit border-* utilities always win,
       and scoped to :not(.light) so light mode is unaffected. -->
  <style type="text/tailwindcss">
    @layer base {
      :where(html:not(.light)) *,
      :where(html:not(.light)) ::before,
      :where(html:not(.light)) ::after {
        border-color: theme('colors.neutral.800');
      }
    }
  </style>

  <!-- Firebase: fully modular SDK via jsdelivr +esm bundles. The previous
       compat-build approach couldn't switch Firestore off WebChannel for
       users on networks where it breaks ("INTERNAL ASSERTION FAILED:
       Unexpected state"). Mixing compat + modular failed because compat
       (gstatic) and modular bundles ship their own internal Firebase app
       registry and don't share state — modular initializeFirestore() then
       errored with "Component firestore has not been registered yet". All
       Firebase modules below come from the same jsdelivr bundle so they
       share one registry and one default app. -->
  <!-- (No <script> tags here; Firebase is loaded inside the init script below.) -->
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAHfgzQoPpojhLFOIRlXF_UJg9lKZjTfA4",
      authDomain: "generator-797d6.firebaseapp.com",
      projectId: "generator-797d6",
      storageBucket: "generator-797d6.firebasestorage.app",
      messagingSenderId: "583041630798",
      appId: "1:583041630798:web:cec475e2be78f31222391f",
      measurementId: "G-FLCL187CN4"
    };
    // The app waits for this promise before mounting React. A module script
    // below resolves it after Firebase loads; the timeout keeps the app from
    // black-screening if a CDN/module import is blocked by the network.
    window.__firebaseInitPromise = new Promise((resolve) => {
      let done = false;
      window.__finishFirebaseInit = (ok) => {
        if (done) return;
        done = true;
        resolve(!!ok);
      };
      setTimeout(() => {
        if (done) return;
        console.warn('Firebase modular init timed out; continuing offline.');
        window.__fb = null;
        window.__fbm = null;
        window.__finishFirebaseInit(false);
      }, 12000);
    });

    // Bootstrap admins — emails in this list are always treated as admin
    // regardless of the role stored in Firestore. Used to seed the first
    // admin so they can promote others from the in-app Users panel.
    const SUPER_ADMINS = ['jpgc06.2023@gmail.com'];

    // ── Google Sheets sync ────────────────────────────────────────────────
    // Paste your Google OAuth 2.0 "Web application" Client ID here to enable
    // one-click sync of SIP/FCS, BMR VOIP and BMR SMS into Google Sheets.
    // Setup (do once, in the Google Cloud Console for project generator-797d6):

    //      JavaScript origins" add your served origins, e.g.
    //        https://<your-user>.github.io   and   http://localhost:5173
    //   3. On the OAuth consent screen add yourself as a test user and the
    //      scope https://www.googleapis.com/auth/drive.file
    //   4. Copy the Client ID (ends in .apps.googleusercontent.com) below.
    // Left blank the app still works — the sync UI just shows a hint. OAuth
    // needs an http(s) origin, so sync runs on the deployed site / localhost,
    // not from a file:// path. The download button works everywhere.
    const GOOGLE_OAUTH_CLIENT_ID = "";

    const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

    const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
</script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { initializeFirestore, doc, collection, getDoc, getDocs, setDoc, serverTimestamp, deleteField } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    try {
      const app = initializeApp(FIREBASE_CONFIG);
      const db = initializeFirestore(app, { experimentalForceLongPolling: true });
      const auth = getAuth(app);
      window.__fbm = {
        doc,
        collection,
        getDoc,
        getDocs,
        setDoc,
        serverTimestamp,
        deleteField,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        sendPasswordResetEmail,
        signOut,
      };
      window.__fb = { auth, db };
      console.info('[firestore]', {
        longPollingApplied: true,
        initMethod: 'modular (gstatic module)',
        origin: location.origin,
      });
      window.__finishFirebaseInit?.(true);
    } catch (e) {
      console.error('Firebase modular init failed:', e);
      window.__fb = null;
      window.__fbm = null;
      window.__finishFirebaseInit?.(false);
    }
  </script>

  <style>
    html, body { font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif; }
    body { background: #1c1c1f; color: #fafafa; -webkit-font-smoothing: antialiased; transition: background-color 0.35s cubic-bezier(0.22, 1, 0.36, 1), color 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 4px; transition: background-color 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
    ::-webkit-scrollbar-thumb:hover { background: #55555e; }
    ::selection { background: rgba(59, 130, 246, 0.3); }
    .loader { width: 14px; height: 14px; border: 2px solid currentColor; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Keep transitions opt-in. The BMR client editor renders hundreds of
       controls, so animating every element makes editing feel delayed. */
    .transition-colors,
    .transition-opacity,
    .transition-transform,
    .transition-all,
    .transition {
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .transition-colors   { transition-duration: 140ms; }
    .transition-opacity  { transition-duration: 160ms; }
    .transition-transform{ transition-duration: 180ms; }
    .transition-all      { transition-duration: 160ms; }
    .transition          { transition-duration: 150ms; }

    /* Respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* Modal / dialog entry animations */
    @keyframes overlayFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes panelPopIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-overlay { animation: overlayFadeIn 220ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-panel   { animation: panelPopIn   260ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* Subtle fade-in for tab content swaps */
    @keyframes contentFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-in { animation: contentFadeIn 240ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* Toast slide-up entry */
    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .anim-toast { animation: toastSlideIn 280ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* Buttons & interactive elements: gentle press feedback */
    button:not(:disabled):active,
    [role="button"]:not([aria-disabled="true"]):active,
    label.cursor-pointer:active {
      transform: scale(0.97);
      transition-duration: 80ms;
    }
    button.no-press:not(:disabled):active {
      transform: none;
      transition-duration: 0ms;
    }
    button.input-clear-button:not(:disabled):active {
      transform: translateY(-50%);
      transition-duration: 0ms;
    }

    /* Default (dark) theme: tell the browser that native controls — <select>
       dropdown popups, number-input spinners, scrollbars, date pickers,
       autofill — should render with their dark styling. Without this the
       browser paints them in light chrome inside the dark UI. html.light
       below flips it back to light. */
    html { color-scheme: dark; }

    /* Premium select system: the trigger and menu use layered surfaces instead
       of native browser chrome so every dropdown feels consistent. */
    .premium-select-trigger {
      min-height: 38px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 55%),
        #09090b;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 1px 2px rgba(0,0,0,0.22);
    }
    .premium-select-trigger:hover {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.008) 60%),
        #101014;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 3px 10px rgba(0,0,0,0.18);
    }
    .premium-select-menu {
      animation: premiumSelectIn 150ms cubic-bezier(0.22, 1, 0.36, 1) both;
      background:
        radial-gradient(circle at 14% -20%, rgba(59,130,246,0.12), transparent 45%),
        linear-gradient(180deg, rgba(255,255,255,0.035), transparent 90px),
        #19191d;
      box-shadow: 0 24px 64px rgba(0,0,0,0.46), 0 5px 18px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.045);
      backdrop-filter: blur(18px);
    }
    .premium-select-options { scrollbar-gutter: stable; }
    @keyframes premiumSelectIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Premium shared controls ------------------------------------------------
       These classes sit on the app's existing primitives, so every module gets
       the same visual quality without introducing parallel component systems. */
    .premium-input,
    .premium-textarea {
      min-height: 40px;
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), transparent 55%),
        #111114;
      border-color: #34343a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.025), 0 1px 2px rgba(0,0,0,0.20);
      transition: border-color 150ms cubic-bezier(0.22,1,0.36,1), box-shadow 150ms cubic-bezier(0.22,1,0.36,1), background-color 150ms cubic-bezier(0.22,1,0.36,1);
    }
    .premium-input:hover,
    .premium-textarea:hover { border-color: #50505a; }
    .premium-input:focus,
    .premium-textarea:focus {
      border-color: rgba(96,165,250,0.78) !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.14), inset 0 1px 0 rgba(255,255,255,0.035) !important;
      background-color: #141419;
    }
    .premium-textarea { line-height: 1.55; }
    .premium-input[type="date"],
    .premium-input[type="time"] {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      cursor: pointer;
    }
    .premium-input[type="date"]::-webkit-calendar-picker-indicator,
    .premium-input[type="time"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.72;
      border-radius: 6px;
      padding: 4px;
      transition: opacity 140ms ease, background-color 140ms ease;
    }
    .premium-input[type="date"]::-webkit-calendar-picker-indicator:hover,
    .premium-input[type="time"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
      background-color: rgba(59,130,246,0.12);
    }

    .premium-button {
      min-height: 36px;
      border-radius: 9px;
      position: relative;
      isolation: isolate;
      letter-spacing: -0.005em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.22);
      transition: transform 140ms cubic-bezier(0.22,1,0.36,1), box-shadow 140ms cubic-bezier(0.22,1,0.36,1), background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .premium-button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 7px 18px rgba(0,0,0,0.22);
    }
    .premium-button[data-variant="primary"] {
      background: linear-gradient(180deg, #ffffff, #e8e8eb);
      box-shadow: inset 0 1px 0 #fff, 0 7px 18px rgba(0,0,0,0.20);
    }
    .premium-button[data-variant="accent"] {
      background: linear-gradient(180deg, #4f9cff, #2879e8);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 8px 20px rgba(37,99,235,0.28);
    }
    .premium-button[data-variant="ghost"] {
      background: linear-gradient(180deg, rgba(255,255,255,0.032), rgba(255,255,255,0.008));
    }
    .premium-button[data-variant="danger"] {
      background: linear-gradient(180deg, rgba(239,68,68,0.11), rgba(239,68,68,0.045));
    }

    /* Premium tooltip system: replaces browser-native title bubbles with a
       compact, app-native glass surface shared by every titled control. */
    .premium-tooltip {
      position: fixed;
      z-index: 200;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: min(290px, calc(100vw - 20px));
      padding: 9px 11px 9px 10px;
      border: 1px solid rgba(113,113,122,0.42);
      border-radius: 10px;
      background:
        radial-gradient(circle at 12% -20%, rgba(59,130,246,0.18), transparent 48%),
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.012)),
        rgba(24,24,28,0.96);
      color: #f4f4f5;
      box-shadow: 0 16px 38px rgba(0,0,0,0.38), 0 4px 12px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.07);
      backdrop-filter: blur(16px) saturate(125%);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.005em;
      pointer-events: none;
      opacity: 0;
      transform: translateY(2px) scale(0.985);
      transform-origin: center;
      transition: opacity 120ms ease, transform 150ms cubic-bezier(0.22,1,0.36,1);
    }
    .premium-tooltip.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .premium-tooltip-accent {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      margin-top: 5px;
      border-radius: 999px;
      background: #60a5fa;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.13), 0 0 10px rgba(96,165,250,0.42);
    }
    .premium-tooltip-arrow {
      position: absolute;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      background: #1d1d22;
      transform: rotate(45deg);
    }
    .premium-tooltip-arrow.is-below {
      bottom: -5px;
      border-right: 1px solid rgba(113,113,122,0.42);
      border-bottom: 1px solid rgba(113,113,122,0.42);
    }
    .premium-tooltip-arrow.is-above {
      top: -5px;
      border-left: 1px solid rgba(113,113,122,0.42);
      border-top: 1px solid rgba(113,113,122,0.42);
    }

    /* Premium date picker --------------------------------------------------
       Fully app-rendered calendar; no operating-system date-picker chrome. */

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      cursor: pointer;
    }
    .premium-date-trigger.is-placeholder { color: #61616a; }

    .premium-date-popover {

    input[type="checkbox"]:not(.sr-only) {
      appearance: none;
      -webkit-appearance: none;
      display: inline-grid;
      place-content: center;
      width: 16px !important;
      height: 16px !important;
      min-width: 16px;
      border: 1px solid #4c4c54 !important;
      border-radius: 5px !important;
      background: linear-gradient(180deg, #242429, #17171b) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.28);
      cursor: pointer;
      transition: background 130ms ease, border-color 130ms ease, box-shadow 130ms ease, transform 100ms ease;
    }
    input[type="checkbox"]:not(.sr-only)::before {
      content: "";
      width: 9px;
      height: 9px;
      transform: scale(0.35);
      opacity: 0;
      transition: transform 120ms cubic-bezier(0.22,1,0.36,1), opacity 100ms ease;
      background: white;
      clip-path: polygon(14% 44%, 0 59%, 40% 100%, 100% 23%, 84% 8%, 39% 71%);
    }
    input[type="checkbox"]:not(.sr-only):checked {
      border-color: #60a5fa !important;
      background: linear-gradient(180deg, #4f9cff, #2563eb) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 0 3px rgba(59,130,246,0.12);
    }
    input[type="checkbox"]:not(.sr-only):checked::before { transform: scale(1); opacity: 1; }
    input[type="checkbox"]:not(.sr-only):focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.24); }
    input[type="checkbox"]:not(.sr-only):disabled { cursor: not-allowed; opacity: 0.42; }

    /* ============================================================
       2026 Glass workspace
       A borderless, spacious visual system shared by every module.
       ============================================================ */
    :root {
      --glass-canvas: #0c0e17;
      --glass-ink: #f7f8ff;
      --glass-muted: #969db2;
      --glass-faint: #6f768c;
      --glass-accent: #8db9ff;
      --glass-accent-strong: #6a9eff;
      --glass-main: rgba(19, 22, 35, 0.78);
      --glass-side: rgba(35, 30, 54, 0.68);
      --glass-card: rgba(255, 255, 255, 0.062);
      --glass-card-hover: rgba(255, 255, 255, 0.086);
      --glass-field: rgba(5, 8, 18, 0.46);
      --glass-nav: rgba(4, 7, 16, 0.42);
      --glass-shadow: 0 28px 80px rgba(2, 5, 18, 0.32);
      --glass-soft-shadow: 0 12px 32px rgba(4, 7, 22, 0.18);
      --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.10),
                     inset 0 -1px 0 rgba(255, 255, 255, 0.025);
      --glass-focus: 0 0 0 3px rgba(125, 174, 255, 0.18),
                     0 10px 28px rgba(41, 91, 180, 0.15);
    }

    html.light {
      --glass-canvas: #dfe7f4;
      --glass-ink: #15233b;
      --glass-muted: #65738a;
      --glass-faint: #66707f;   /* was #8a96a8 — only 2.84:1 on the glass surfaces (footers, meta lines); now 4.8:1 */
      --glass-accent: #397fe6;
      --glass-accent-strong: #236bd5;
      --glass-main: rgba(249, 251, 255, 0.80);
      --glass-side: rgba(255, 255, 255, 0.42);
      --glass-card: rgba(255, 255, 255, 0.56);
      --glass-card-hover: rgba(255, 255, 255, 0.76);
      --glass-field: rgba(255, 255, 255, 0.58);
      --glass-nav: rgba(223, 230, 242, 0.58);
      --glass-shadow: 0 28px 80px rgba(55, 67, 96, 0.16);
      --glass-soft-shadow: 0 12px 32px rgba(67, 78, 108, 0.11);
      --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.88),
                     inset 0 -1px 0 rgba(81, 102, 139, 0.08);
      --glass-focus: 0 0 0 3px rgba(57, 127, 230, 0.14),
                     0 10px 28px rgba(57, 127, 230, 0.11);
    }

    html {
      background: var(--glass-canvas);
      scroll-behavior: smooth;
    }
    body,
    html.light body {
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--glass-ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(143, 91, 196, 0.54), transparent 27%),
        radial-gradient(circle at 92% 4%, rgba(67, 157, 204, 0.48), transparent 28%),
        radial-gradient(circle at 10% 92%, rgba(221, 132, 102, 0.38), transparent 28%),
        linear-gradient(135deg, #151426 0%, var(--glass-canvas) 52%, #111a26 100%) !important;
    }
    html.light body {
      background:
        radial-gradient(circle at 4% 7%, rgba(148, 103, 195, 0.54), transparent 31%),
        radial-gradient(circle at 94% 3%, rgba(75, 164, 205, 0.48), transparent 30%),
        radial-gradient(circle at 6% 95%, rgba(224, 147, 113, 0.42), transparent 30%),
        linear-gradient(135deg, #d9dced 0%, #e4eaf4 52%, #d9e7ee 100%) !important;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(118deg, transparent 0 46%, rgba(255,255,255,0.035) 46.2%, transparent 46.8%),
        radial-gradient(circle at 66% 72%, rgba(114, 102, 218, 0.12), transparent 24%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 5px);
      mix-blend-mode: soft-light;
    }
    #root {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
    }

    /* Floating app frame: the same geometry is used by all module branches. */
    body > #root > div {
      box-sizing: border-box;
      min-height: 100dvh !important;
      gap: 16px;
      padding: 16px;
      color: var(--glass-ink) !important;
    }
    body > #root > div > aside,
    body > #root > div > main {
      min-height: calc(100dvh - 32px);
    }
    body > #root > div > aside {
      top: 16px !important;
      height: calc(100dvh - 32px) !important;
      border: 0 !important;
      border-radius: 28px;
      color: #f8f7ff;
      background:
        radial-gradient(circle at 4% 4%, rgba(179, 119, 220, 0.32), transparent 31%),
        radial-gradient(circle at 104% 18%, rgba(95, 161, 216, 0.25), transparent 38%),
        radial-gradient(circle at 18% 102%, rgba(235, 142, 111, 0.24), transparent 34%),
        linear-gradient(155deg, rgba(61, 49, 83, 0.77), rgba(31, 33, 55, 0.68)) !important;
      box-shadow: var(--glass-shadow), var(--glass-inset) !important;
      /* Deliberately NO backdrop-filter here. Nothing scrolls behind the
         sidebar — its backdrop is only the fixed body gradient — so the blur
         was a no-op, but it made the sidebar a backdrop root. Chromium
         re-derives that root whenever a layer is promoted elsewhere (e.g. the
         translateY(-1px) lift on a module-switcher button in the header), and
         it re-sampled the backdrop as near-black: a dark box flashed over the
         whole sidebar while hovering RCA. The blur was invisible anyway (a
         blurred smooth gradient is the same gradient); only the saturate()
         had any effect, and losing it costs a barely perceptible amount of
         colour behind a ~55%-alpha overlay. */
    }
    /* The base layer is deliberately heavier than it looks like it needs to be.
       The sidebar carries white text in BOTH themes, so a pastel panel here put
       every label near 2-3:1. Deepening the base gradient (0.54/0.40 -> 0.86/0.74)
       takes white to ~5.3:1 while the radial tints keep the panel colourful. */
    html.light body > #root > div > aside {
      color: #fff;
      background:
        radial-gradient(circle at 2% 2%, rgba(149, 93, 199, 0.50), transparent 34%),
        radial-gradient(circle at 105% 18%, rgba(70, 147, 200, 0.43), transparent 41%),
        radial-gradient(circle at 16% 103%, rgba(224, 132, 101, 0.42), transparent 37%),
        linear-gradient(150deg, rgba(90, 72, 132, 0.90), rgba(82, 103, 148, 0.80)) !important;
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.42) !important;
    }
    body > #root > div > main {
      position: relative;
      border-radius: 30px;
      background:
        radial-gradient(circle at 96% 0%, rgba(112, 173, 232, 0.075), transparent 24%),
        linear-gradient(150deg, rgba(255,255,255,0.035), transparent 36%),
        var(--glass-main) !important;
      box-shadow: var(--glass-shadow), var(--glass-inset);
      backdrop-filter: blur(30px) saturate(1.28);
      -webkit-backdrop-filter: blur(30px) saturate(1.28);
    }
    html.light body > #root > div > main {
      background:
        radial-gradient(circle at 96% 0%, rgba(103, 172, 225, 0.11), transparent 27%),
        linear-gradient(145deg, rgba(255,255,255,0.72), rgba(255,255,255,0.36)),
        var(--glass-main) !important;
    }

    /* Let spacing establish hierarchy instead of separator lines. */
    body > #root > div .border-neutral-900,
    body > #root > div .border-neutral-900\/60,
    body > #root > div .border-neutral-800,
    body > #root > div .border-neutral-800\/80,
    body > #root > div .divide-neutral-900 > * + *,
    body > #root > div > aside .border-b,
    body > #root > div > aside .border-t,
    body > #root > div > main > footer {
      border-color: transparent !important;
    }
    body > #root > div > aside > div.border-b,
    body > #root > div > aside > div.border-t {
      position: relative;
    }
    body > #root > div > aside > div.border-b::after,
    body > #root > div > aside > div.border-t::before {
      display: none;
    }

    /* Header / navigation deck */
    .app-topbar {
      top: 16px !important;
      margin: 12px 12px 0;
      padding: 20px 22px !important;
      border: 0 !important;
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.075), rgba(255,255,255,0.026)),
        rgba(13, 16, 28, 0.58) !important;
      box-shadow: var(--glass-soft-shadow), var(--glass-inset) !important;
      backdrop-filter: blur(28px) saturate(1.38);
      -webkit-backdrop-filter: blur(28px) saturate(1.38);
    }
    html.light .app-topbar {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.74), rgba(255,255,255,0.44)),
        rgba(238, 243, 251, 0.58) !important;
    }
    .app-topbar h2 {
      color: var(--glass-ink);
      font-size: clamp(1.45rem, 1.6vw, 1.85rem) !important;
      font-weight: 650;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }
    .app-topbar .text-\[10px\] {
      color: var(--glass-accent) !important;
      font-weight: 600;
      letter-spacing: 0.16em !important;
    }
    .app-segmented,
    .app-tab-nav,
    .premium-tabs,
    .premium-auth-tabs {
      gap: 4px !important;
      padding: 5px !important;
      border: 0 !important;
      border-radius: 14px !important;
      background: var(--glass-nav) !important;
      box-shadow: var(--glass-inset) !important;
      /* No backdrop-filter: these strips sit directly on the already-frosted
         .app-topbar, so there was nothing left to blur — it only nested a
         third backdrop root inside topbar-inside-main, right where the hover
         repaint happens. See the sidebar note above. */
    }
    .app-segmented button,
    .app-tab-nav button,
    .premium-tabs button,
    .premium-auth-tabs button {
      min-height: 36px;
      border: 0 !important;
      border-radius: 10px !important;
      padding-inline: 14px;
      color: var(--glass-muted) !important;
      background: transparent !important;
      box-shadow: none !important;
      transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 180ms ease !important;
    }
    .app-segmented button:hover,
    .app-tab-nav button:hover,
    .premium-tabs button:hover,
    .premium-auth-tabs button:hover {
      color: var(--glass-ink) !important;
      background: rgba(255,255,255,0.065) !important;
      transform: translateY(-1px);
    }
    .app-segment-active,
    .app-tab-active,
    .app-segmented button.is-active,
    .premium-tabs button.bg-neutral-800,
    .premium-auth-tabs button.bg-neutral-800 {
      color: #f9fbff !important;
      background:
        linear-gradient(135deg, rgba(111, 158, 246, 0.92), rgba(109, 109, 210, 0.82)) !important;
      box-shadow: 0 8px 20px rgba(55, 92, 184, 0.24), inset 0 1px 0 rgba(255,255,255,0.25) !important;
    }
    html.light .app-segment-active,
    html.light .app-tab-active,
    html.light .app-segmented button.is-active,
    html.light .premium-tabs button.bg-neutral-800,
    html.light .premium-auth-tabs button.bg-neutral-800 {
      color: #fff !important;
      background: linear-gradient(135deg, #558ee4, #7272cf) !important;
    }
    .app-segment-more-menu {
      border: 0 !important;
      border-radius: 16px !important;
      background: rgba(24, 27, 42, 0.92) !important;
      box-shadow: 0 22px 56px rgba(2,5,18,0.34), var(--glass-inset) !important;
      backdrop-filter: blur(24px);
    }
    html.light .app-segment-more-menu {
      background: rgba(250,252,255,0.94) !important;
    }

    /* Common surfaces */
    .premium-card,
    body > #root > div .premium-empty-state,
    body > #root > div details,
    body > #root > div [class~="bg-neutral-950/60"],
    body > #root > div [class~="bg-neutral-950/50"],
    body > #root > div [class~="bg-neutral-900/40"] {
      border: 0 !important;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025)),
        var(--glass-card) !important;
      box-shadow: var(--glass-soft-shadow), var(--glass-inset) !important;
      backdrop-filter: blur(18px) saturate(1.18);
      -webkit-backdrop-filter: blur(18px) saturate(1.18);
    }
    .premium-card {
      border-radius: 20px !important;
      transition: background 200ms ease, box-shadow 200ms ease, transform 200ms ease !important;
    }
    .premium-card:hover {
      border-color: transparent !important;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.095), rgba(255,255,255,0.035)),
        var(--glass-card-hover) !important;
      box-shadow: 0 18px 46px rgba(2,5,18,0.20), var(--glass-inset) !important;
      transform: translateY(-1px);
    }
    html.light .premium-card,
    html.light body > #root > div .premium-empty-state,
    html.light body > #root > div details,
    html.light body > #root > div [class~="bg-neutral-950/60"],
    html.light body > #root > div [class~="bg-neutral-950/50"],
    html.light body > #root > div [class~="bg-neutral-900/40"] {
      border-color: transparent !important;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.80), rgba(255,255,255,0.42)),
        var(--glass-card) !important;
      box-shadow: var(--glass-soft-shadow), var(--glass-inset) !important;
    }

    /* Sidebar disclosure panels already sit on the sidebar's glass surface.
       Giving them another blurred backdrop and a wide outer shadow creates a
       separate compositor layer; Chromium can briefly repaint that shadow as
       a dark strip when controls in the main workspace are hovered. Keep the
       subtle glass edge, but avoid the redundant nested blur and cast shadow. */
    body > #root > div > aside details {
      box-shadow: var(--glass-inset) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* Translucent panel fill — FLAT, IN-PAGE SURFACES ONLY.
       `bg-[#232327]` must NOT be listed here. Per the §11d ramp it is the
       "raised card / modal / popover" step, i.e. every floating surface in the
       app: the module-switcher overflow menu, the confirm/auth dialogs and the
       image-editor modal. These selectors carry #root, so they outranked each
       component's own near-opaque fill (1,2,3 vs 0,2,1) and flattened all of
       them to 34% alpha — 48% in light mode — and page text read straight
       through an open menu. Floating surfaces now fall through to their own
       rules, or to the plain `.bg-[#232327]` utility, which is solid. */
    body > #root > div .bg-neutral-950,
    body > #root > div .bg-neutral-900 {
      background-color: rgba(8, 11, 22, 0.34) !important;
    }
    html.light body > #root > div .bg-neutral-950,
    html.light body > #root > div .bg-neutral-900 {
      background-color: rgba(255,255,255,0.48) !important;
    }

    /* Form controls */
    .premium-input,
    .premium-textarea,
    .premium-select-trigger {
      min-height: 40px;
      border: 0 !important;
      border-radius: 11px !important;
      color: var(--glass-ink) !important;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.028), transparent),
        var(--glass-field) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.055), 0 5px 14px rgba(2,5,18,0.10) !important;
      transition: background 170ms ease, box-shadow 170ms ease, transform 170ms ease !important;
    }
    .premium-input:hover,
    .premium-textarea:hover,
    .premium-select-trigger:hover {
      border-color: transparent !important;
      background-color: rgba(255,255,255,0.075) !important;
    }
    .premium-input:focus,
    .premium-textarea:focus,
    .premium-select-trigger:focus,
    .premium-select-trigger:focus-visible {
      border-color: transparent !important;
      outline: none !important;
      background-color: rgba(10, 14, 27, 0.70) !important;
      box-shadow: var(--glass-focus), inset 0 1px 0 rgba(255,255,255,0.08) !important;
    }
    html.light .premium-input,
    html.light .premium-textarea,
    html.light .premium-select-trigger {
      color: var(--glass-ink) !important;
      border-color: transparent !important;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.74), rgba(255,255,255,0.46)),
        var(--glass-field) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 6px 18px rgba(55,67,96,0.08) !important;
    }
    html.light .premium-input:focus,
    html.light .premium-textarea:focus,
    html.light .premium-select-trigger:focus {
      background: rgba(255,255,255,0.90) !important;
      box-shadow: var(--glass-focus), inset 0 1px 0 #fff !important;
    }
    .premium-select-menu,
    .premium-date-popover,
    .premium-tooltip {
      border: 0 !important;
      background:
        radial-gradient(circle at 12% -10%, rgba(111,158,246,0.14), transparent 42%),
        rgba(22, 25, 40, 0.94) !important;
      box-shadow: 0 28px 76px rgba(2,5,18,0.42), var(--glass-inset) !important;
      backdrop-filter: blur(28px) saturate(1.3);
    }
    html.light .premium-select-menu,
    html.light .premium-date-popover,
    html.light .premium-tooltip {
      background:
        radial-gradient(circle at 12% -10%, rgba(86,146,228,0.12), transparent 42%),
        rgba(250,252,255,0.96) !important;
      box-shadow: 0 28px 76px rgba(55,67,96,0.18), var(--glass-inset) !important;
    }

    /* Buttons read as soft glass actions, never outlined boxes. */
    .premium-button {
      min-height: 36px;
      border: 0 !important;
      border-radius: 10px !important;
      box-shadow: 0 7px 18px rgba(2,5,18,0.13), inset 0 1px 0 rgba(255,255,255,0.10) !important;
      transition: transform 170ms ease, filter 170ms ease, background 170ms ease, box-shadow 170ms ease !important;
    }
    .premium-button:not(:disabled):hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow: 0 11px 24px rgba(2,5,18,0.20), inset 0 1px 0 rgba(255,255,255,0.14) !important;
    }
    .premium-button[data-variant="primary"] {
      color: #16213a !important;
      background: linear-gradient(135deg, #f8faff, #c9ddff) !important;
    }
    .premium-button[data-variant="accent"] {
      color: #fff !important;
      background: linear-gradient(135deg, #5b91e8, #7375d3) !important;
    }
    .premium-button[data-variant="ghost"] {
      color: var(--glass-ink) !important;
      background: rgba(255,255,255,0.072) !important;
    }
    .premium-button[data-variant="danger"] {
      color: #ffb9be !important;
      background: rgba(205, 68, 83, 0.16) !important;
    }
    html.light .premium-button {
      box-shadow: 0 7px 18px rgba(55,67,96,0.10), inset 0 1px 0 rgba(255,255,255,0.88) !important;
    }
    html.light .premium-button[data-variant="primary"] {
      color: #fff !important;
      background: linear-gradient(135deg, #263b5e, #16243e) !important;
    }
    html.light .premium-button[data-variant="ghost"] {
      color: #253854 !important;
      background: rgba(255,255,255,0.54) !important;
    }
    html.light .premium-button[data-variant="danger"] {
      color: #a53846 !important;
      background: rgba(255,255,255,0.46) !important;
    }
    .premium-chip {
      min-height: 27px;
      border: 0 !important;
      border-radius: 9px !important;
      background: rgba(255,255,255,0.065) !important;
      box-shadow: var(--glass-inset) !important;
    }
    html.light .premium-chip {
      background: rgba(255,255,255,0.52) !important;
    }
    /* Sidebar surfaces, light mode only.
       The panel is dark and everything on it inherits white text, so a fill
       here has to be DARKER than the panel. The global light-mode overrides do
       the opposite — they make these surfaces white-translucent (52% for chips,
       54% for buttons, 48% for the selected sheet row), which left white labels
       sitting at 1.5-2:1. Same dark-translucent trick the sidebar inputs use.
       Dark mode keeps the light fills: there the panel is already dark, so a
       light fill is exactly what makes these read. Form controls are excluded —
       a checkbox still needs a light box to show its checked state. */
    html.light body > #root > div > aside .premium-chip,
    html.light body > #root > div > aside .premium-button,
    html.light body > #root > div > aside .bg-neutral-900:not(input):not(select):not(textarea) {
      color: rgba(255,255,255,0.94) !important;
      background: rgba(17, 14, 38, 0.32) !important;
    }
    html.light body > #root > div > aside .premium-button[data-variant="danger"] {
      color: #ffccd2 !important;
      background: rgba(74, 16, 28, 0.42) !important;
    }

    /* Sidebar hierarchy */
    body > #root > div > aside h1 {
      color: #fff;
      font-size: 1.18rem !important;
      font-weight: 650;
      letter-spacing: -0.025em;
    }
    body > #root > div > aside .text-neutral-100,
    body > #root > div > aside .text-neutral-200,
    body > #root > div > aside .text-neutral-300,
    html.light body > #root > div > aside .text-neutral-100,
    html.light body > #root > div > aside .text-neutral-200,
    html.light body > #root > div > aside .text-neutral-300 {
      color: rgba(255,255,255,0.94) !important;
    }
    body > #root > div > aside .text-neutral-400,
    body > #root > div > aside .text-neutral-500,
    body > #root > div > aside .text-neutral-600 {
      color: rgba(245,245,255,0.60) !important;
    }
    /* Light mode's sidebar panel is far paler than dark mode's, so the same
       60% white measured only ~2:1 there — the muted labels, the sync status
       and the account row all read as barely-there. Kept separate from the
       dark rule above so dark mode retains its softer muted tier. */
    html.light body > #root > div > aside .text-neutral-400,
    html.light body > #root > div > aside .text-neutral-500,
    html.light body > #root > div > aside .text-neutral-600 {
      color: rgba(255,255,255,0.86) !important;
    }
    body > #root > div > aside .premium-input,
    body > #root > div > aside .premium-textarea,
    body > #root > div > aside .premium-select-trigger,
    html.light body > #root > div > aside .premium-input,
    html.light body > #root > div > aside .premium-textarea,
    html.light body > #root > div > aside .premium-select-trigger {
      color: #fff !important;
      background: rgba(13, 13, 28, 0.23) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 6px 16px rgba(30,20,55,0.10) !important;
    }
    body > #root > div > aside .premium-input::placeholder,
    body > #root > div > aside .premium-textarea::placeholder {
      color: rgba(255,255,255,0.38) !important;
    }
    body > #root > div > aside .premium-card,
    body > #root > div > aside .bg-neutral-950,
    html.light body > #root > div > aside .premium-card,
    html.light body > #root > div > aside .bg-neutral-950 {
      color: #fff !important;
      background: rgba(255,255,255,0.075) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 8px 20px rgba(30,20,55,0.08) !important;
    }
    body > #root > div > aside button:not(.premium-button) {
      border-color: transparent !important;
    }
    body > #root > div > aside button:not(.premium-button):hover {
      background-color: rgba(255,255,255,0.075) !important;
    }

    /* Content rhythm */
    body > #root > div > main > header + div {
      width: 100%;
      max-width: 1560px !important;
      padding: clamp(24px, 2.8vw, 44px) !important;
    }
    body > #root > div > main > footer {
      padding: 20px clamp(24px, 2.8vw, 44px) !important;
      color: var(--glass-faint) !important;
      background: transparent;
    }
    body > #root > div h3 {
      color: var(--glass-muted);
      letter-spacing: 0.10em !important;
    }
    body > #root > div .space-y-6 > :not([hidden]) ~ :not([hidden]) {
      --tw-space-y-reverse: 0;
      margin-top: calc(1.75rem * calc(1 - var(--tw-space-y-reverse)));
      margin-bottom: calc(1.75rem * var(--tw-space-y-reverse));
    }
    body > #root > div .space-y-12 > :not([hidden]) ~ :not([hidden]) {
      --tw-space-y-reverse: 0;
      margin-top: calc(3.5rem * calc(1 - var(--tw-space-y-reverse)));
      margin-bottom: calc(3.5rem * var(--tw-space-y-reverse));
    }

    /* Tables keep data alignment but use tone, not rules, for grouping. */
    main table:not([data-plain-table]) {
      border: 0 !important;
      border-radius: 16px;
      background: rgba(8,11,22,0.18);
      box-shadow: var(--glass-soft-shadow), var(--glass-inset) !important;
    }
    main table:not([data-plain-table]) th,
    main table:not([data-plain-table]) td {
      border-color: rgba(255,255,255,0.025) !important;
    }
    main table:not([data-plain-table]) thead {
      background: rgba(255,255,255,0.045) !important;
    }
    main table:not([data-plain-table]) tbody tr:nth-child(even) {
      background: rgba(255,255,255,0.018);
    }
    html.light main table:not([data-plain-table]) {
      background: rgba(255,255,255,0.36);
    }
    html.light main table:not([data-plain-table]) th,
    html.light main table:not([data-plain-table]) td {
      border-color: rgba(73,91,123,0.045) !important;
    }
    html.light main table:not([data-plain-table]) thead {
      background: rgba(255,255,255,0.58) !important;
    }

    /* Dialogs, uploads and feedback */
    .premium-auth-backdrop,
    .anim-overlay.fixed {
      background:
        radial-gradient(circle at 18% 12%, rgba(137,92,198,0.25), transparent 32%),
        rgba(6,8,16,0.70) !important;
      backdrop-filter: blur(18px) saturate(0.9);
    }
    .premium-auth-panel,
    .anim-panel {
      border: 0 !important;
      border-radius: 24px !important;
      background:
        radial-gradient(circle at 8% 0%, rgba(115,157,240,0.14), transparent 36%),
        rgba(27,30,45,0.90) !important;
      box-shadow: 0 38px 100px rgba(2,5,18,0.44), var(--glass-inset) !important;
      backdrop-filter: blur(30px);
    }
    html.light .premium-auth-panel,
    html.light .anim-panel {
      background:
        radial-gradient(circle at 8% 0%, rgba(85,142,226,0.12), transparent 36%),
        rgba(249,251,255,0.94) !important;
    }
    .premium-upload-zone,
    .premium-empty-state {
      border: 0 !important;
      border-radius: 16px !important;
    }
    .anim-toast {
      border: 0 !important;
      background-color: rgba(24,27,42,0.90) !important;
    }
    button:focus-visible,
    [role="button"]:focus-visible,
    a:focus-visible {
      outline: none !important;
      box-shadow: var(--glass-focus) !important;
    }

    /* Operational clarity pass -------------------------------------------
       The app is a dense internal tool. These rules raise functional text,
       keep form hints readable, reserve elevation for major surfaces, and
       make compact controls easier to acquire without changing behavior. */
    body > #root > div .text-\[9px\]  { font-size: 10.5px !important; }
    body > #root > div .text-\[10px\] { font-size: 11px !important; }
    body > #root > div .text-\[11px\] { font-size: 12px !important; }

    .premium-input::placeholder,
    .premium-textarea::placeholder {
      color: #a4a9b8 !important;
      opacity: 1;
    }
    html.light .premium-input::placeholder,
    html.light .premium-textarea::placeholder {
      color: #626b7b !important;
    }
    body > #root > div > aside .premium-input::placeholder,
    body > #root > div > aside .premium-textarea::placeholder,
    html.light body > #root > div > aside .premium-input::placeholder,
    html.light body > #root > div > aside .premium-textarea::placeholder {
      color: rgba(255,255,255,0.78) !important;
    }

    body > #root > div button { min-height: 32px; }
    body > #root > div button:has(> svg:only-child) {
      min-width: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    body > #root > div input[type="checkbox"] {
      min-width: 16px;
      min-height: 16px;
    }

    body > #root > div > main .premium-card,
    body > #root > div > main details,
    body > #root > div > main [class~="bg-neutral-950/60"],
    body > #root > div > main [class~="bg-neutral-950/50"],
    body > #root > div > main [class~="bg-neutral-900/40"] {
      box-shadow: var(--glass-inset) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    body > #root > div > main .premium-card:hover {
      transform: none !important;
      box-shadow: var(--glass-inset) !important;
    }

    .app-topbar {
      padding: 16px 18px !important;
      gap: 12px !important;
    }
    .app-header-controls {
      flex-wrap: nowrap !important;
      align-items: center;
      min-width: 0;
    }
    .app-header-controls > .app-segmented {
      min-width: 0;
      flex: 0 1 auto;
    }
    .app-header-controls > .app-tab-nav {
      flex: 0 0 auto;
    }
    @media (max-width: 1450px) {
      .app-pill-row { display: none !important; }
    }

    .client-list-viewport {
      max-height: min(68dvh, 760px);
      overscroll-behavior: contain;
      border-radius: 14px;
      background: rgba(8,11,22,0.16);
      scrollbar-gutter: stable;
    }
